[auth.external.apple]
enabled = true
client_id = "com.heitor.nina"
secret = ""
redirect_uri = ""
url = ""
skip_nonce_check = false
email_optional = false

[functions.nina-chat]
verify_jwt = true

[functions.nina-maintenance]
verify_jwt = false

[functions.premium-subscription-sync]
verify_jwt = true

[functions.app-store-server-notifications]
verify_jwt = false
